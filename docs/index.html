<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>나의 책장</title>
<!--
  나의 책장 · 사이트 쪽 (아이폰 UI 스타일)
  이 폴더(docs/)가 GitHub Pages 로 웹에 올라간다. 화면은 이 파일 하나이고, 데이터는 같은 폴더의 shelf.json 하나만 읽는다.
  shelf.json 은 어드민의 [게시] 버튼이 만든다. 여기서 직접 고치지 말고 어드민에서 고친 뒤 게시한다.
  디자인은 마음대로 바꿔도 된다. shelf.json 을 읽는 부분만 남아 있으면 어드민과 게시는 그대로 돌아간다.
  색, 칸 크기만 살짝 바꿀 때는 아래 :root 의 값을 고치면 화면 전체에 반영된다.
  --accent 가 버튼·링크 색(아이폰 기본 파란색). 다른 색으로 바꾸면 전체 포인트 색이 바뀐다.
-->
<style>
  :root {
    --bg: #f2f2f7;          /* 바탕 (아이폰 설정 앱 회색) */
    --card: #ffffff;        /* 카드 */
    --card-2: #f2f2f7;      /* 카드 안의 칸 */
    --ink: #000000;         /* 글자 */
    --muted: #8e8e93;       /* 흐린 글자 */
    --line: rgba(60,60,67,.18);  /* 구분선 */
    --accent: #007aff;      /* 포인트 색 (아이폰 파란색) */
    --heart: #ff375f;       /* 추천 하트 */
    --bar: rgba(242,242,247,.78);  /* 위쪽 반투명 바 */
    --sheet-shadow: 0 -10px 40px rgba(0,0,0,.12);
    --sheet-bar: rgba(242,242,247,.85);  /* 상세 시트 위쪽 바 */
    --cover-w: 128px;       /* 표지 칸의 최소 너비. 키우면 한 줄에 들어가는 책이 줄어든다 */
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1c1c1e; --card-2: #2c2c2e; --ink: #ffffff; --muted: #8e8e93;
      --line: rgba(84,84,88,.6); --accent: #0a84ff; --heart: #ff375f;
      --bar: rgba(22,22,24,.72); --sheet-shadow: 0 -10px 40px rgba(0,0,0,.6); --sheet-bar: rgba(0,0,0,.8);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right)); }

  /* 위쪽 반투명 바. 스크롤하면 작은 제목이 나타난다 (아이폰 Large Title 방식) */
  .navbar {
    position: sticky; top: 0; z-index: 10; padding-top: env(safe-area-inset-top);
    background: transparent; border-bottom: .5px solid transparent;
    transition: background .2s, border-color .2s;
  }
  .navbar.scrolled {
    background: var(--bar); border-bottom-color: var(--line);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  .navbar .wrap { height: 44px; display: flex; align-items: center; justify-content: center; position: relative; }
  .navbar .small-title { font-size: 17px; font-weight: 600; opacity: 0; transition: opacity .2s; }
  .navbar.scrolled .small-title { opacity: 1; }

  /* 큰 제목 */
  header .wrap { padding-top: 4px; padding-bottom: 6px; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.15; }
  .owner { color: var(--muted); margin: 4px 0 0; font-size: 15px; }

  /* 세그먼트 컨트롤 (표지 / 목록, 전체 / 추천) */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 4px; }
  .seg { display: inline-flex; background: rgba(118,118,128,.12); border-radius: 9px; padding: 2px; flex: 1 1 200px; max-width: 320px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 6px 10px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .2s, box-shadow .2s; }
  .seg button[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }
  @media (prefers-color-scheme: dark) { .seg { background: rgba(118,118,128,.24); } .seg button[aria-pressed="true"] { background: #636366; } }

  main .wrap { padding-bottom: 40px; }

  /* 섹션 (연도별). 아이폰 설정 앱의 묶음 목록처럼 */
  .section { margin-top: 26px; }
  .section h2 { font-size: 13px; font-weight: 400; color: var(--muted); text-transform: uppercase; margin: 0 0 7px 16px; letter-spacing: 0; }
  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; }

  /* 표지 보기 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cover-w), 1fr)); gap: 22px 16px; padding: 18px 16px 16px; align-items: end; }
  .book { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; transition: transform .15s ease; }
  .book:active { transform: scale(.96); }
  .book .cv { position: relative; }
  .book img, .book .nocover { width: 100%; display: block; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 16px rgba(0,0,0,.12); }
  .book .t { font-size: 13px; font-weight: 500; margin-top: 8px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book .a { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.85); color: var(--heart); font-size: 13px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  /* 표지가 없는 책은 제목 카드로 */
  .nocover { aspect-ratio: 2 / 3; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 12px; background: linear-gradient(160deg, #5e5ce6, #007aff); color: #fff; text-align: left; }
  .nocover b { font-size: 14px; line-height: 1.3; }
  .nocover span { font-size: 11.5px; opacity: .85; }

  /* 목록 보기 (아이폰 설정 앱 줄) */
  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; border: 0; background: none; cursor: pointer; text-align: left; position: relative; }
  .row:active { background: var(--card-2); }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 76px; right: 0; border-top: .5px solid var(--line); }
  .row .thumb { width: 48px; flex: none; }
  .row .thumb img, .row .thumb .nocover { width: 48px; border-radius: 5px; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .row .thumb .nocover { padding: 4px; } .row .thumb .nocover b { font-size: 8px; } .row .thumb .nocover span { display: none; }
  .row .txt { flex: 1; min-width: 0; }
  .row .t { font-size: 17px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .a { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .row .heart { color: var(--heart); font-size: 15px; }
  .chev { width: 8px; height: 13px; flex: none; color: rgba(60,60,67,.3); }
  @media (prefers-color-scheme: dark) { .chev { color: rgba(235,235,245,.3); } }

  /* 책 상세: 아래에서 올라오는 시트 */
  dialog {
    border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 640px; max-height: 92vh; max-height: 92dvh;
    border-radius: 14px 14px 0 0; background: var(--bg); color: var(--ink); box-shadow: var(--sheet-shadow);
    overflow: auto; overscroll-behavior: contain;
  }
  dialog[open] { animation: up .32s cubic-bezier(.2,.9,.3,1); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog[open]::backdrop { animation: fade .25s ease; }
  @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (min-width: 700px) {
    dialog { margin: auto; border-radius: 14px; max-height: 86vh; }
    dialog[open] { animation: pop .25s cubic-bezier(.2,.9,.3,1); }
    @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  }
  .sheet-top { position: sticky; top: 0; z-index: 2; background: var(--sheet-bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: rgba(127,127,127,.4); margin: 6px auto 0; }
  @media (min-width: 700px) { .grabber { display: none; } }
  .sheet-bar { height: 44px; display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; }
  .done { border: 0; background: none; color: var(--accent); font-size: 17px; font-weight: 600; cursor: pointer; padding: 8px 0; }
  .sheet-body { padding: 4px 16px calc(28px + env(safe-area-inset-bottom)); }
  .hero { text-align: center; }
  .hero .cv img, .hero .cv .nocover { width: 170px; margin: 0 auto; border-radius: 10px; display: block; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
  .hero .cv .nocover { text-align: left; }
  .hero h3 { font-size: 22px; font-weight: 700; margin: 18px 0 4px; line-height: 1.3; letter-spacing: -0.02em; }
  .hero .by { color: var(--muted); font-size: 15px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; padding: 4px 10px; border-radius: 99px; background: rgba(255,55,95,.12); color: var(--heart); font-size: 13px; font-weight: 600; }
  .group { margin-top: 22px; }
  .group h4 { font-size: 13px; font-weight: 400; color: var(--muted); margin: 0 0 7px 16px; }
  .info { display: flex; justify-content: space-between; gap: 16px; padding: 11px 16px; font-size: 16px; position: relative; }
  .info + .info::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--line); }
  .info span:last-child { color: var(--muted); text-align: right; }
  .text { padding: 14px 16px; font-size: 16px; line-height: 1.6; white-space: pre-wrap; }
  .text.q { font-style: italic; border-left: 3px solid var(--accent); margin: 12px 16px; padding: 2px 0 2px 12px; }
  .link-btn { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; color: var(--accent); text-decoration: none; font-size: 17px; }
  .link-btn:active { background: var(--card-2); }


  /* ① 올해 독서 현황 (아이폰 '피트니스' 링 느낌) */
  .stats { padding: 16px; }
  .stats-top { display: flex; align-items: center; gap: 18px; }
  .ring { width: 96px; height: 96px; flex: none; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: rgba(0,122,255,.15); }
  .ring .fill { stroke: var(--accent); transition: stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1); }
  .ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
  .ring .num b { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .ring .num span { font-size: 11px; color: var(--muted); }
  .stats-txt h3 { font-size: 17px; font-weight: 600; margin: 0 0 3px; }
  .stats-txt p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
  .stats-txt .big { color: var(--ink); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .ring .track { stroke: rgba(10,132,255,.22); } }

  /* ⑤ 읽는 중 / 읽고 싶은 책 */
  .prog { height: 4px; border-radius: 2px; background: rgba(118,118,128,.2); overflow: hidden; margin-top: 7px; }
  .prog i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .row .pct { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .hscroll { display: flex; gap: 14px; overflow-x: auto; padding: 16px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .hscroll .book { flex: 0 0 92px; scroll-snap-align: start; }

  /* ⑥ 별점 */
  .stars { color: #ff9500; letter-spacing: 1px; font-size: 11px; }
  .stars .off { color: rgba(118,118,128,.35); }
  .book .r { line-height: 1; margin-top: 3px; }
  .hero .stars { font-size: 17px; display: block; margin-top: 6px; }
  .pill.reading { background: rgba(0,122,255,.12); color: var(--accent); }
  .pill.want { background: rgba(118,118,128,.14); color: var(--muted); }
  .hero .prog { width: 200px; margin: 10px auto 0; }


  /* 책장: 나무 선반 위에 표지가 서 있다. 줄 높이를 고정해서 선반을 배경 무늬로 그린다 */
  :root {
    --cover-h: 168px;       /* 표지 높이. 키우면 책이 커진다 */
    --plank: 20px;          /* 선반 두께 */
    --row-h: calc(var(--cover-h) + var(--plank) + 22px);
    --wood-top: #e3c7a0; --wood-front: #c79c6b; --wood-edge: #a97d4f;
    --shelf-back: #f7f2ea;  /* 책장 안쪽 벽 */
  }
  @media (prefers-color-scheme: dark) {
    :root { --wood-top: #7a5a3c; --wood-front: #5c4229; --wood-edge: #47321f; --shelf-back: #1d1a16; }
  }
  .bookcase { background: var(--shelf-back); border-radius: var(--radius); overflow: hidden;
    box-shadow: inset 0 0 0 .5px var(--line); }
  .shelf {
    display: flex; flex-wrap: wrap; align-content: flex-start; padding: 0 14px;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,.07) 0, transparent 8px,                                        /* 위 선반이 드리운 그림자 */
      transparent calc(var(--row-h) - var(--plank)),
      var(--wood-top) calc(var(--row-h) - var(--plank)),                         /* 선반 윗면 */
      var(--wood-top) calc(var(--row-h) - var(--plank) + 6px),
      var(--wood-front) calc(var(--row-h) - var(--plank) + 6px),                 /* 선반 앞면 */
      var(--wood-front) calc(var(--row-h) - 3px),
      var(--wood-edge) calc(var(--row-h) - 3px), var(--wood-edge) var(--row-h)); /* 앞면 아래 모서리 */
  }
  .slot { height: var(--row-h); display: flex; align-items: flex-end; padding: 0 9px calc(var(--plank) - 5px); }
  .slot .book { position: relative; display: block; }
  .slot .book img, .slot .book .nocover { height: var(--cover-h); width: calc(var(--cover-h) * .68); object-fit: cover; background: rgba(127,127,127,.15); border-radius: 2px 4px 4px 2px;
    box-shadow: inset 3px 0 4px rgba(0,0,0,.12), 2px 0 3px rgba(0,0,0,.18), 6px 4px 10px rgba(0,0,0,.18); }
  .chip { white-space: nowrap; }
  .slot .book::after { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.18); border-radius: 1px; pointer-events: none; } /* 책등 접힌 선 */
  .slot .book:hover { transform: translateY(-6px); }
  .slot .book:active { transform: translateY(-3px) scale(.98); }
  .chip { position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: 99px; font-size: 10.5px; font-weight: 600;
    background: rgba(0,0,0,.62); color: #fff; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); line-height: 1.4; }
  .chip.star { color: #ffcc4d; }
  .cover-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,.35); border-radius: 0 0 4px 2px; overflow: hidden; }
  .cover-prog i { display: block; height: 100%; background: var(--accent); }
  .shelf-empty { height: var(--row-h); display: flex; align-items: center; padding: 0 9px var(--plank); color: var(--muted); font-size: 14px; }
  @media (max-width: 600px) {
    :root { --cover-h: 122px; --plank: 16px; --row-h: calc(var(--cover-h) + var(--plank) + 18px); }
    .shelf { padding: 0 8px; }
    .slot { padding: 0 6px calc(var(--plank) - 4px); }
    .chip { font-size: 9.5px; left: 4px; bottom: 5px; padding: 1px 5px; }
  }


  /* 분류별로 보기: 가로로 넘기는 칩 */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 2px 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 0; border-radius: 99px; padding: 6px 13px; font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 .5px var(--line); transition: background .15s, color .15s; }
  .chips button span { color: var(--muted); margin-left: 3px; font-weight: 400; }
  .chips button[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: none; }
  .chips button[aria-pressed="true"] span { color: rgba(255,255,255,.8); }
  .chips:empty { display: none; }


  /* A. 독서 달력: 달마다 그달 읽은 표지가 부채꼴로 쌓인다 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 7px 16px; }
  .cal-head h2 { margin: 0; }
  .years { display: flex; gap: 4px; }
  .years button { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 2px 8px; border-radius: 99px; cursor: pointer; }
  .years button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 .5px var(--line); }
  .cal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .mtile { background: var(--card); border-radius: 12px; padding: 10px 10px 12px; min-height: 132px; display: flex; flex-direction: column; }
  .mtile.now { box-shadow: inset 0 0 0 2px var(--accent); }
  .mtile.future { opacity: .45; }
  .mh { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .mh b { font-weight: 600; } .mh span { color: var(--muted); font-size: 12px; }
  .mtile.now .mh b { color: var(--accent); }
  .mstack { position: relative; flex: 1; margin-top: 8px; min-height: 86px; }
  .mbook { position: absolute; bottom: 0; left: calc(var(--i) * 26px + 4px); border: 0; padding: 0; background: none; cursor: pointer;
    transform: rotate(calc((var(--i) - 1) * 5deg)); transform-origin: bottom center; transition: transform .2s; z-index: var(--i); }
  .mbook img, .mbook .nocover { width: 54px; height: 80px; object-fit: cover; border-radius: 3px; display: block; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .mbook .nocover { padding: 4px; } .mbook .nocover b { font-size: 8px; } .mbook .nocover span { display: none; }
  .mbook:hover { transform: rotate(0) translateY(-6px); z-index: 9; }
  .more { position: absolute; right: 2px; bottom: 2px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .mempty { position: absolute; inset: 6px 0 0; border: 1.5px dashed var(--line); border-radius: 6px; }
  .cal-note { font-size: 12px; color: var(--muted); margin: 8px 16px 0; }
  @media (max-width: 600px) {
    .cal { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .mtile { padding: 8px 8px 10px; min-height: 118px; }
    .mstack { min-height: 72px; }
    .mbook { left: calc(var(--i) * 20px + 2px); }
    .mbook img, .mbook .nocover { width: 44px; height: 66px; }
  }

  /* B. 올해 독서 결산 카드 */
  .wrapped-cta { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; text-align: left; cursor: pointer; color: #fff;
    padding: 16px 18px; border-radius: var(--radius); background: linear-gradient(120deg, #0a84ff, #5e5ce6 55%, #bf5af2); box-shadow: 0 6px 20px rgba(94,92,230,.3); }
  .wrapped-cta:active { transform: scale(.98); }
  .wrapped-cta .ic { font-size: 26px; }
  .wrapped-cta b { display: block; font-size: 17px; }
  .wrapped-cta span { font-size: 13.5px; opacity: .85; }
  .wrapped-cta .chev { color: rgba(255,255,255,.7); margin-left: auto; }
  .wrap-card img { width: 100%; max-width: 420px; display: block; margin: 0 auto; border-radius: 16px; box-shadow: 0 12px 34px rgba(0,0,0,.25); }
  .wrap-card .loading { aspect-ratio: 4 / 5; max-width: 420px; margin: 0 auto; border-radius: 16px; background: linear-gradient(120deg, #0a84ff, #5e5ce6 55%, #bf5af2); display: grid; place-items: center; color: #fff; }
  .wrap-actions { display: flex; gap: 10px; max-width: 420px; margin: 16px auto 0; }
  .wrap-actions button { flex: 1; border: 0; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; }
  .wrap-actions button.sub { background: var(--card); color: var(--accent); }
  .wrap-hint { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 10px; }

  /* C. 책 꺼내기: 표지 사본이 화면 위를 날아간다 */
  .fly { position: fixed; z-index: 50; margin: 0; pointer-events: none; object-fit: cover; border-radius: 4px; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  dialog.fade[open] { animation: fade .22s ease; }
  dialog.closing { opacity: 0; transition: opacity .16s ease; }
  dialog.closing::backdrop { opacity: 0; transition: opacity .16s ease; }
  dialog.measure { visibility: hidden; animation: none !important; }
  dialog.measure::backdrop { opacity: 0; }

  footer .wrap { padding-top: 8px; padding-bottom: calc(32px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 12px; text-align: center; line-height: 1.6; }
  footer a { color: var(--accent); text-decoration: none; }
  .empty { color: var(--muted); padding: 60px 16px; text-align: center; }

  /* 폰: 아이폰 '도서' 앱처럼 한 줄에 3권 */
  @media (max-width: 600px) {
    :root { --cover-w: 88px; }
    .grid { gap: 20px 12px; padding: 16px 14px 14px; }
    .book .t { font-size: 12.5px; } .book .a { font-size: 11.5px; }
    .badge { width: 20px; height: 20px; font-size: 11px; top: 4px; right: 4px; }

<body>
<nav class="navbar" id="navbar"><div class="wrap"><span class="small-title" id="smallTitle">나의 책장</span></div></nav>
<header><div class="wrap">
  <h1 id="title">나의 책장</h1>
  <p class="owner" id="owner"></p>
  <div class="controls">
    <div class="seg" role="group" aria-label="고르기">
      <button type="button" data-filter="all" aria-pressed="true">전체</button>
      <button type="button" data-filter="fav" aria-pressed="false">♥ 추천</button>
    </div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="분류"></div>
</div></header>
<main><div class="wrap" id="shelf"></div></main>
<dialog id="dlg" aria-label="책 정보" tabindex="-1">
  <div class="sheet-top"><div class="grabber"></div><div class="sheet-bar"><button class="done" type="button" onclick="closeBook()">완료</button></div></div>
  <div class="sheet-body" id="detail"></div>
</dialog>
<footer><div class="wrap">
  <!-- YES24 API 이용 조건. 화면에 출처를 표시하고 상품 페이지로 가는 링크를 둔다. 지우지 말 것 -->
  도서 정보와 표지 제공 <a href="https://www.yes24.com" target="_blank" rel="noopener">YES24</a><br><span id="updated"></span>
</div></footer>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// YES24 표지 주소 끝의 크기 글자를 바꾼다. 목록은 L, 크게 볼 때는 XL
const sized = (url, size) => /image\.yes24\.com\/goods\/\d+\/[A-Z]+$/.test(url || '') ? url.replace(/\/[A-Z]+$/, '/' + size) : url;
const CHEV = '<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let BOOKS = [];
let GOAL = 0;
const isRead = b => !b.status || b.status === 'read';
const starsHtml = n => n ? `<span class="stars" aria-label="별점 ${n}점">${'★'.repeat(n)}<span class="off">${'★'.repeat(5 - n)}</span></span>` : '';
// 보기 방식은 방문자 브라우저에 기억해 둔다 (안 되면 그냥 기본값)
const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const state = { filter: 'all', cat: '', calYear: 0 };   // cat: 고른 분류(빈 값이면 전체), calYear: 달력에서 보는 해
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)');

function coverHtml(b, size) {
  return b.cover
    ? `<img src="${esc(sized(b.cover, size))}" alt="${esc(b.title)} 표지" loading="lazy">`
    : `<div class="nocover"><b>${esc(b.title)}</b><span>${esc(b.author)}</span></div>`;
}

// 책 한 권 = 선반 위 한 칸. 제목은 표지 위 글자 대신 마우스를 올리면 나오고, 누르면 상세가 열린다
function slotHtml(b) {
  const chip = b.status === 'reading' ? `<span class="chip">${b.progress || 0}%</span>`
    : b.rating ? `<span class="chip star">★ ${b.rating}</span>` : '';
  return `<div class="slot"><button class="book" data-id="${b.id}" title="${esc(b.title)} · ${esc(b.author)}" aria-label="${esc(b.title)}">
    ${coverHtml(b, 'L')}${b.fav ? '<span class="badge" aria-label="추천">♥</span>' : ''}${chip}
    ${b.status === 'reading' ? `<span class="cover-prog"><i style="width:${b.progress || 0}%"></i></span>` : ''}
  </button></div>`;
}
const shelfHtml = list => `<div class="bookcase"><div class="shelf">${list.map(slotHtml).join('')}</div></div>`;

// ① 올해 독서 현황: 목표 링 + 월별 막대 (다 읽은 책만 센다)
function statsHtml() {
  const now = new Date(), year = now.getFullYear();
  const done = BOOKS.filter(b => isRead(b) && Number(b.year) === year);
  const reading = BOOKS.filter(b => b.status === 'reading').length, want = BOOKS.filter(b => b.status === 'want').length;
  const C = 2 * Math.PI * 42, ratio = GOAL ? Math.min(1, done.length / GOAL) : 0;
  const line = GOAL
    ? `<span class="big">${done.length}권</span> 읽음 · 목표 ${GOAL}권 (${Math.round(done.length / GOAL * 100)}%)`
    : `<span class="big">${done.length}권</span> 읽음`;
  const extra = [reading ? `읽는 중 ${reading}권` : '', want ? `읽고 싶은 책 ${want}권` : ''].filter(Boolean).join(' · ');
  return `<section class="section"><h2>올해 독서 현황</h2><div class="card stats">
    <div class="stats-top">
      <div class="ring" role="img" aria-label="${GOAL ? `목표 ${GOAL}권 중 ${done.length}권` : `${done.length}권 읽음`}">
        <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42" fill="none" stroke-width="11"/>
        <circle class="fill" cx="50" cy="50" r="42" fill="none" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C * (1 - ratio)}" style="${ratio ? '' : 'display:none'}"/></svg>
        <div class="num"><b>${done.length}</b><span>${GOAL ? '/ ' + GOAL + '권' : '권'}</span></div>
      </div>
      <div class="stats-txt"><h3>${year}년</h3><p>${line}</p>${extra ? `<p>${extra}</p>` : ''}</div>
    </div>
  </div></section>`;
}

function render() {
  document.querySelectorAll('[data-filter]').forEach(el => el.setAttribute('aria-pressed', el.dataset.filter === state.filter));
  if (!BOOKS.length) { $('#shelf').innerHTML = '<p class="empty">아직 꽂힌 책이 없어요.</p>'; return; }
  renderChips();
  const fav = state.filter === 'fav';
  const pick = list => list.filter(b => (!fav || b.fav) && (!state.cat || (b.category || '기타') === state.cat));
  const reading = pick(BOOKS.filter(b => b.status === 'reading'));
  const want = pick(BOOKS.filter(b => b.status === 'want'));
  const done = pick(BOOKS.filter(isRead));
  // 고른 게 있으면 독서 현황·결산·달력은 숨긴다
  let html = fav || state.cat ? '' : statsHtml() + wrappedCtaHtml() + calendarHtml();

  // 읽는 중 · 읽고 싶은 책 · 다 읽은 책(해마다) 을 각각 한 칸의 책장으로
  if (reading.length) html += `<section class="section"><h2>읽는 중 · ${reading.length}권</h2>${shelfHtml(reading)}</section>`;
  if (want.length) html += `<section class="section"><h2>읽고 싶은 책 · ${want.length}권</h2>${shelfHtml(want)}</section>`;
  const years = [...new Set(done.map(b => b.year))];   // shelf.json 이 이미 최근 순으로 정렬돼 있다
  html += years.map(y => {
    const list = done.filter(b => b.year === y);
    return `<section class="section"><h2>${esc(y)}년 · ${list.length}권</h2>${shelfHtml(list)}</section>`;
  }).join('');
  if (!reading.length && !want.length && !done.length) html = `<p class="empty">${fav ? '이 분류에 추천 표시(♥)한 책이 아직 없어요.' : '이 분류의 책이 없어요.'}</p>`;
  $('#shelf').innerHTML = html;

  // 링은 그려진 뒤 채운다 (애니메이션)
  requestAnimationFrame(() => document.querySelectorAll('.ring .fill').forEach(c => c.style.strokeDashoffset = c.dataset.off));
}

// 분류 칩: 실제 쓰인 분류만, 권수 많은 순. 분류가 하나뿐이면 숨긴다
function renderChips() {
  const counts = {}; BOOKS.forEach(b => { const c = b.category || '기타'; counts[c] = (counts[c] || 0) + 1; });
  const cats = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (state.cat && !counts[state.cat]) state.cat = '';
  $('#chips').innerHTML = cats.length < 2 ? '' :
    [['', BOOKS.length, '전체'], ...cats.map(([c, n]) => [c, n, c])].map(([c, n, label]) =>
      `<button type="button" data-cat="${esc(c)}" aria-pressed="${c === state.cat}">${esc(label)}<span>${n}</span></button>`).join('');
}

function openBook(id, src) {
  const b = BOOKS.find(x => x.id === id);
  if (!b) return;
  MODE = 'book';
  const when = `${b.year}년${b.month ? ' ' + b.month + '월' : ''}`;
  const whenLabel = b.status === 'reading' ? '시작한 때' : b.status === 'want' ? '담은 때' : '읽은 때';
  const rows = [['저자', b.author], ['출판사', b.publisher], [whenLabel, when], ['형태', b.media], ['분류', b.category]].filter(r => r[1]);
  if (b.rating) rows.push(['별점', `${b.rating}점`]);
  $('#detail').innerHTML = `
    <div class="hero">
      <div class="cv">${coverHtml(b, 'XL')}</div>
      <h3>${esc(b.title)}</h3>
      <div class="by">${esc(b.author)}</div>
      ${starsHtml(b.rating)}
      ${b.status === 'reading' ? `<div class="pill reading">읽는 중 · ${b.progress || 0}%</div><div class="prog"><i style="width:${b.progress || 0}%"></i></div>` : ''}
      ${b.status === 'want' ? '<div class="pill want">읽고 싶은 책</div>' : ''}
      ${b.fav ? '<div class="pill">♥ 추천</div>' : ''}
    </div>
    ${b.review || b.quote ? `<div class="group"><h4>나의 기록</h4><div class="card">
      ${b.review ? `<div class="text">${esc(b.review)}</div>` : ''}
      ${b.quote ? `<div class="text q">${esc(b.quote)}</div>` : ''}
    </div></div>` : ''}
    <div class="group"><h4>정보</h4><div class="card">
      ${rows.map(r => `<div class="info"><span>${r[0]}</span><span>${esc(r[1])}</span></div>`).join('')}
    </div></div>
    ${b.link ? `<div class="group"><div class="card"><a class="link-btn" href="${esc(b.link)}" target="_blank" rel="noopener"><span>YES24에서 보기</span>${CHEV}</a></div></div>` : ''}`;
  // 표지 비율을 미리 정해 둔다 (큰 표지가 늦게 받아져도 자리가 흔들리지 않게)
  const heroImg = $('#detail .hero .cv img');
  const ratio = src && src.naturalWidth ? src.naturalHeight / src.naturalWidth : 1.45;
  if (heroImg) heroImg.style.aspectRatio = `1 / ${ratio}`;
  pullOut(src, heroImg);
}

// ── C. 책 꺼내기 ──
let MODE = 'book', SRC = null, FLYING = false;
// 애니메이션이 끝나면 한 번만 실행. 탭이 백그라운드라 끝 신호가 늦어도 시간이 지나면 반드시 실행한다
const whenDone = (anim, ms, fn) => { let ran = false; const go = () => { if (!ran) { ran = true; fn(); } }; anim.onfinish = go; setTimeout(go, ms + 120); };
function showSheet(fade) {
  const d = $('#dlg');
  d.classList.toggle('fade', !!fade);
  d.showModal(); d.focus(); d.scrollTop = 0;   // 시트 자체에 초점 (완료 버튼에 테두리가 생기지 않게)
}
function flyEl(from, rect) {
  const el = from.cloneNode(true);
  el.classList.add('fly'); el.removeAttribute('loading');
  Object.assign(el.style, { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', height: rect.height + 'px' });
  document.body.appendChild(el);
  return el;
}
function pullOut(src, heroImg) {
  SRC = src || null;
  if (!src || !heroImg || REDUCE.matches || FLYING) return showSheet(false);
  // 1) 시트를 안 보이게 열어서 큰 표지가 놓일 자리를 잰다
  const d = $('#dlg'); d.classList.add('measure'); d.showModal(); d.scrollTop = 0;
  const to = heroImg.getBoundingClientRect(); d.close(); d.classList.remove('measure');
  const from = src.getBoundingClientRect();
  // 2) 선반의 표지를 들어 올렸다가 가운데로 날린다
  FLYING = true;
  const el = flyEl(src, from); src.style.visibility = 'hidden';
  const a = el.animate([
    { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px', transform: 'none' },
    { left: from.left + 'px', top: from.top - 18 + 'px', width: from.width + 'px', height: from.height + 'px', transform: 'rotate(-3deg) scale(1.05)', offset: .28 },
    { left: to.left + 'px', top: to.top + 'px', width: to.width + 'px', height: to.height + 'px', transform: 'none' }
  ], { duration: 560, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' });
  whenDone(a, 560, () => { showSheet(true); setTimeout(() => { el.remove(); FLYING = false; }, 30); });
}
function closeBook() {
  const d = $('#dlg');
  if (!d.open || FLYING) return;
  const hero = $('#detail .hero .cv img, #detail .hero .cv .nocover');
  const back = () => { if (SRC) SRC.style.visibility = ''; SRC = null; };
  if (MODE !== 'book' || !SRC || !hero || REDUCE.matches || !document.body.contains(SRC)) { d.close(); back(); return; }
  // 시트는 흐려지고, 표지는 원래 선반 자리로 돌아간다
  const from = hero.getBoundingClientRect(), to = SRC.getBoundingClientRect(), src = SRC;
  FLYING = true;
  d.classList.add('closing');
  setTimeout(() => {
    d.close(); d.classList.remove('closing', 'fade');
    const el = flyEl(hero, from);
    const a = el.animate([
      { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' },
      { left: to.left + 'px', top: to.top + 'px', width: to.width + 'px', height: to.height + 'px' }
    ], { duration: 420, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' });
    whenDone(a, 420, () => { src.style.visibility = ''; el.remove(); SRC = null; FLYING = false; });
  }, 160);
}

// ── A. 독서 달력 ──
function calendarHtml() {
  const done = BOOKS.filter(isRead);
  const years = [...new Set(done.map(b => Number(b.year)))].filter(Boolean).sort((a, b) => b - a);
  if (!years.length) return '';
  const now = new Date();
  const y = years.includes(state.calYear) ? state.calYear : (years.includes(now.getFullYear()) ? now.getFullYear() : years[0]);
  const inYear = done.filter(b => Number(b.year) === y);
  const unknown = inYear.filter(b => !b.month).length;
  const tiles = Array.from({ length: 12 }, (_, i) => {
    const m = i + 1, list = inYear.filter(b => Number(b.month) === m);
    const isNow = y === now.getFullYear() && m === now.getMonth() + 1;
    const future = y > now.getFullYear() || (y === now.getFullYear() && m > now.getMonth() + 1);
    return `<div class="mtile${isNow ? ' now' : ''}${future ? ' future' : ''}">
      <div class="mh"><b>${m}월</b><span>${list.length ? list.length + '권' : ''}</span></div>
      <div class="mstack">${list.length ? list.slice(0, 3).map((b, k) =>
        `<button class="mbook" data-id="${b.id}" style="--i:${k}" title="${esc(b.title)}" aria-label="${esc(b.title)}">${coverHtml(b, 'L')}</button>`).join('')
        + (list.length > 3 ? `<span class="more">+${list.length - 3}</span>` : '') : (future ? '' : '<span class="mempty"></span>')}</div></div>`;
  }).join('');
  return `<section class="section"><div class="cal-head"><h2>독서 달력</h2>${years.length > 1
      ? `<div class="years">${years.map(v => `<button type="button" data-year="${v}" aria-pressed="${v === y}">${v}</button>`).join('')}</div>` : ''}</div>
    <div class="cal">${tiles}</div>${unknown ? `<p class="cal-note">읽은 달을 적지 않은 책 ${unknown}권은 달력에 없어요.</p>` : ''}</section>`;
}

// ── B. 올해 독서 결산 카드 ──
function wrappedCtaHtml() {
  const y = new Date().getFullYear();
  if (!BOOKS.some(b => isRead(b) && Number(b.year) === y)) return '';
  return `<section class="section"><button class="wrapped-cta" type="button" id="wrappedBtn"><span class="ic">✦</span>
    <div><b>${y} 독서 결산 카드</b><span>올해 읽은 책을 한 장으로 모아 봐요</span></div>${CHEV}</button></section>`;
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fit(ctx, text, max) { text = String(text); if (ctx.measureText(text).width <= max) return text; while (text && ctx.measureText(text + '…').width > max) text = text.slice(0, -1); return text + '…'; }
const loadImg = url => new Promise(res => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => res(null); im.src = url; });
async function drawWrapped() {
  const W = 1080, H = 1350, y = new Date().getFullYear();
  const F = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif';
  const done = BOOKS.filter(b => isRead(b) && Number(b.year) === y);
  const reading = BOOKS.filter(b => b.status === 'reading');
  const count = (list, key) => { const c = {}; list.forEach(b => { const k = key(b); if (k) c[k] = (c[k] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]; };
  const topCat = count(done, b => b.category || '기타'), topMonth = count(done, b => b.month);
  const best = [...done].filter(b => b.rating).sort((a, b) => b.rating - a.rating || (b.fav - a.fav))[0];
  const picks = [...done].sort((a, b) => (b.fav - a.fav) || ((b.rating || 0) - (a.rating || 0))).slice(0, 5);
  const imgs = await Promise.all(picks.map(b => b.cover ? loadImg(sized(b.cover, 'L')) : Promise.resolve(null)));

  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#0a84ff'); g.addColorStop(.55, '#5e5ce6'); g.addColorStop(1, '#bf5af2');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const glow = c.createRadialGradient(W * .85, H * .1, 0, W * .85, H * .1, 700); glow.addColorStop(0, 'rgba(255,255,255,.22)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = glow; c.fillRect(0, 0, W, H);
  c.fillStyle = '#fff'; c.textBaseline = 'alphabetic';
  c.font = `600 30px ${F}`; c.globalAlpha = .75; c.fillText(`MY READING ${y}`, 80, 120); c.globalAlpha = 1;
  c.font = `800 76px ${F}`; c.fillText(`${y} 나의 독서`, 80, 210);
  // 큰 숫자
  c.font = `800 250px ${F}`; c.fillText(String(done.length), 72, 470);
  const nw = c.measureText(String(done.length)).width;
  c.font = `700 80px ${F}`; c.fillText('권', 92 + nw, 470);
  c.font = `500 38px ${F}`; c.globalAlpha = .9;
  c.fillText(GOAL ? `목표 ${GOAL}권 중 ${Math.round(done.length / GOAL * 100)}% 달성` : '올해 다 읽은 책', 84, 535); c.globalAlpha = 1;
  if (GOAL) { c.fillStyle = 'rgba(255,255,255,.25)'; rr(c, 84, 560, 600, 14, 7); c.fill(); c.fillStyle = '#fff'; rr(c, 84, 560, Math.max(14, 600 * Math.min(1, done.length / GOAL)), 14, 7); c.fill(); }
  // 대표 표지 5권
  const cw = 168, ch = 248, gap = 22, total = picks.length * cw + (picks.length - 1) * gap;
  let x = (W - total) / 2; const top = 630;
  picks.forEach((b, i) => {
    c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 30; c.shadowOffsetY = 14;
    rr(c, x, top, cw, ch, 10); c.fillStyle = 'rgba(255,255,255,.2)'; c.fill(); c.restore();
    c.save(); rr(c, x, top, cw, ch, 10); c.clip();
    const im = imgs[i];
    if (im) { const s = Math.max(cw / im.width, ch / im.height); c.drawImage(im, x + (cw - im.width * s) / 2, top + (ch - im.height * s) / 2, im.width * s, im.height * s); }
    else { c.fillStyle = 'rgba(255,255,255,.9)'; c.fillRect(x, top, cw, ch); c.fillStyle = '#333'; c.font = `700 24px ${F}`; c.fillText(fit(c, b.title, cw - 24), x + 12, top + ch - 24); }
    c.restore();
    if (b.fav) { c.fillStyle = '#fff'; c.beginPath(); c.arc(x + cw - 24, top + 24, 18, 0, Math.PI * 2); c.fill(); c.fillStyle = '#ff375f'; c.font = `700 22px ${F}`; c.fillText('♥', x + cw - 35, top + 32); }
    x += cw + gap;
  });
  // 2×2 정보 칸
  const tiles = [
    ['가장 많이 읽은 분류', topCat ? `${topCat[0]} · ${topCat[1]}권` : '—'],
    ['가장 많이 읽은 달', topMonth ? `${topMonth[0]}월 · ${topMonth[1]}권` : '—'],
    ['최고 별점', best ? `★${best.rating} ${best.title}` : '—'],
    ['지금 읽는 중', reading[0] ? `${reading[0].title} ${reading[0].progress || 0}%` : '—'],
  ];
  tiles.forEach(([label, value], i) => {
    const tx = 80 + (i % 2) * 470, ty = 935 + Math.floor(i / 2) * 170;
    c.fillStyle = 'rgba(255,255,255,.16)'; rr(c, tx, ty, 450, 150, 28); c.fill();
    c.fillStyle = '#fff'; c.globalAlpha = .75; c.font = `500 28px ${F}`; c.fillText(label, tx + 30, ty + 56); c.globalAlpha = 1;
    c.font = `700 40px ${F}`; c.fillText(fit(c, value, 390), tx + 30, ty + 112);
  });
  c.globalAlpha = .7; c.font = `500 24px ${F}`;
  c.fillText((location.host + location.pathname).replace(/index\.html$/, '').replace(/\/$/, ''), 80, 1300);
  c.textAlign = 'right'; c.fillText('도서 정보·표지 제공 YES24', W - 80, 1300); c.textAlign = 'left'; c.globalAlpha = 1;
  return cv;
}
async function openWrapped() {
  MODE = 'wrapped'; SRC = null;
  const y = new Date().getFullYear();
  $('#detail').innerHTML = `<div class="wrap-card"><div class="loading">카드를 만드는 중…</div></div>`;
  showSheet(false);
  const cv = await drawWrapped();
  let url = '';
  try { url = cv.toDataURL('image/png'); } catch (e) { url = ''; }
  if (!url) { $('#detail').innerHTML = '<p class="empty">카드를 만들지 못했어요.</p>'; return; }
  $('#detail').innerHTML = `<div class="wrap-card"><img src="${url}" alt="${y} 나의 독서 결산 카드"></div>
    <div class="wrap-actions"><button type="button" id="saveWrapped">이미지로 저장</button>${navigator.canShare ? '<button type="button" class="sub" id="shareWrapped">공유</button>' : ''}</div>
    <p class="wrap-hint">휴대폰에서는 카드를 길게 눌러 사진에 저장할 수도 있어요.</p>`;
  const name = `${y}-나의독서.png`;
  $('#saveWrapped').onclick = () => { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
  $('#shareWrapped')?.addEventListener('click', () => cv.toBlob(async blob => {
    const file = new File([blob], name, { type: 'image/png' });
    try { if (navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: `${y} 나의 독서` }); } catch (e) {}
  }, 'image/png'));
}

$('#shelf').addEventListener('click', e => {
  const yr = e.target.closest('[data-year]'); if (yr) { state.calYear = Number(yr.dataset.year); render(); return; }
  if (e.target.closest('#wrappedBtn')) { openWrapped(); return; }
  const el = e.target.closest('[data-id]'); if (el) openBook(Number(el.dataset.id), el.querySelector('img, .nocover'));
});
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeBook(); });   // 바깥을 누르면 닫힘
$('#dlg').addEventListener('cancel', e => { e.preventDefault(); closeBook(); });          // Esc 키
$('#chips').addEventListener('click', e => { const el = e.target.closest('[data-cat]'); if (el) { state.cat = el.dataset.cat; render(); } });
document.querySelectorAll('[data-filter]').forEach(el => el.addEventListener('click', () => { state.filter = el.dataset.filter; render(); }));


// 스크롤하면 위쪽 바가 반투명해지고 작은 제목이 나타난다
const onScroll = () => $('#navbar').classList.toggle('scrolled', window.scrollY > 40);
window.addEventListener('scroll', onScroll, { passive: true }); onScroll();

// 캐시 때문에 게시한 내용이 늦게 보이지 않게 매번 새로 받는다
fetch('shelf.json?t=' + Date.now()).then(r => r.json()).then(data => {
  const shelf = data.shelf || {};
  const title = shelf.title || '나의 책장';
  document.title = title; $('#title').textContent = title; $('#smallTitle').textContent = title;
  BOOKS = data.books || [];
  GOAL = Number(shelf.goal) || 0;
  $('#owner').textContent = (shelf.owner ? `${shelf.owner} · ` : '') + `읽은 책 ${BOOKS.filter(isRead).length}권`;
  $('#updated').textContent = data.updated ? `${data.updated} 업데이트` : '';
  render();
}).catch(() => { $('#shelf').innerHTML = '<p class="empty">shelf.json 을 읽지 못했어요. 어드민에서 [게시]를 눌렀는지 확인해 주세요.</p>'; });
</script>
